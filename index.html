<!DOCTYPE html>
<html lang="en">
<head>

<style>

button{margin-top:18px;font:inherit;font-weight:900;font-size:19px;color:#fff;border:0;padding:14px 34px;border-radius:999px;cursor:pointer;

@keyframes drop{from{transform:scale(.7)}60%{transform:scale(1.08)}to{transform:scale(1)}}

@keyframes msg{0%{opacity:0;transform:translate(-50%,20px) scale(.5)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}

</style>
</head>

function clearPreview(){for(let n=0;n<previewCount;n++){const i=previewIndices[n];previewFlags[i]=0;renderCell(i)}previewCount=0}
function markCompletedPreviewLines(){lineCount=0;for(let r=0;r<N;r++){let full=true;for(let c=0;c<N;c++){const i=r*N+c;if(g[r][c]<0&&!placedFlags[i]){full=false;break}}if(full)for(let c=0;c<N;c++){const i=r*N+c;if(!lineFlags[i]){lineFlags[i]=1;lineIndices[lineCount++]=i}}}for(let c=0;c<N;c++){let full=true;for(let r=0;r<N;r++){const i=r*N+c;if(g[r][c]<0&&!placedFlags[i]){full=false;break}}if(full)for(let r=0;r<N;r++){const i=r*N+c;if(!lineFlags[i]){lineFlags[i]=1;lineIndices[lineCount++]=i}}}}
function processMove(e){if(!drag)return;const L=e.clientX-drag.W/2,Tp=e.clientY-drag.H-70;drag.el.style.transform=`translate3d(${L}px,${Tp}px,0)`;const gc=Math.round((L-ox)/pitch),gr=Math.round((Tp-oy)/pitch);if(drag.valid&&drag.tr===gr&&drag.tc===gc)return;clearPreview();drag.valid=false;if(!fits(drag.p.s,gr,gc,g))return;const shape=drag.p.s,col=drag.p.col;for(let n=0;n<shape.c.length;n++){const cell=shape.c[n],i=(gr+cell[0])*N+gc+cell[1];placedFlags[i]=1}markCompletedPreviewLines();drag.valid=true;drag.tr=gr;drag.tc=gc;for(let n=0;n<shape.c.length;n++){const cell=shape.c[n],i=(gr+cell[0])*N+gc+cell[1],d=cells[i];d.className='c f gh';setVar(d,'--a',C[col][0]);setVar(d,'--b',C[col][1]);markPreview(i)}for(let n=0;n<lineCount;n++){const i=lineIndices[n],d=cells[i];setVar(d,'--a',C[col][0]);setVar(d,'--b',C[col][1]);if(placedFlags[i])d.classList.add('ln');else d.className='c f ln';markPreview(i);lineFlags[i]=0}lineCount=0;for(let n=0;n<shape.c.length;n++){const cell=shape.c[n];placedFlags[(gr+cell[0])*N+gc+cell[1]]=0}}
function queueMove(e){if(!drag||e.pointerId!==drag.id)return;const samples=e.getCoalescedEvents?.(),last=samples&&samples.length?samples[samples.length-1]:e;pendingPointer={clientX:last.clientX,clientY:last.clientY};if(!dragFrame)dragFrame=requestAnimationFrame(flushMove)}
function flushMove(){dragFrame=0;const point=pendingPointer;pendingPointer=null;if(point)processMove(point)}
function cancelMove(){if(dragFrame)cancelAnimationFrame(dragFrame);dragFrame=0;pendingPointer=null}
function start(e,i){if(!pcs[i]||busy||drag)return;e.preventDefault();SND.init();metrics();SND.pick();try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}const p=pcs[i],el=mk(p,cs,3);el.classList.add('drag');document.body.append(el);slots[i].classList.add('used');drag={i,p,el,valid:false,tr:-1,tc:-1,W:p.s.w*pitch-3,H:p.s.h*pitch-3,id:e.pointerId};processMove(e)}
function end(e){if(!drag||e.pointerId!==drag.id)return;if(e.type==='pointerup'){cancelMove();processMove({clientX:e.clientX,clientY:e.clientY})}else cancelMove();const d=drag,valid=d.valid,r=d.tr,c=d.tc;drag=null;d.el.remove();clearPreview();if(valid&&e.type==='pointerup')place(d.i,d.p,r,c);else{if(e.type==='pointerup')SND.nope();slots[d.i].classList.remove('used')}}
function captureLost(e){if(drag&&e.pointerId===drag.id)end({type:'pointercancel',pointerId:e.pointerId})}
addEventListener('pointermove',queueMove);addEventListener('pointerup',end);addEventListener('pointercancel',end);addEventListener('lostpointercapture',captureLost);
/* place + clear */
function place(i,p,r,c){busy=true;p.s.c.forEach(([y,x])=>{const k=(r+y)*N+c+x;g[r+y][c+x]=p.col;addFilled(k)});pcs[i]=null;render(p.s.c.map(([y,x])=>(r+y)*N+c+x));scheduleAmbient();
p.s.c.forEach(([y,x])=>cells[(r+y)*8+c+x].style.animation='drop .22s');
SND.place(c+(p.s.w>>1),p.s.c.length);buzz(10);setScore(p.s.c.length);
p.s.c.forEach(([y,x])=>{const rc=cells[(r+y)*8+c+x].getBoundingClientRect();spark(rc.left+rc.width/2,rc.top+rc.height/2,'#ffffff',2,6)});
const L=lines(g),set=lineSet(L),n=L.rows.length+L.cols.length;
tray(false);
if(n){combo++;SND.clear(n,combo);SND.level(combo);
const pts=n*20+(n>1?(n-1)*30:0)+combo*10;setScore(pts);
buzz([20,30,40]);
const words=['','','Great!','Amazing!','Incredible!','Unreal!'];let m=words[Math.min(n,5)];if(combo>1)m=(m?m+'<br>':'')+'Combo ×'+combo;if(!m&&n===1&&combo<=1)m='';
say(m);set.forEach(k=>{const d=cells[k];d.classList.add('pop');const rc=d.getBoundingClientRect(),v=g[k>>3][k&7];burst(rc.left+rc.width/2,rc.top+rc.height/2,C[v][0],7);spark(rc.left+rc.width/2,rc.top+rc.height/2,'#fff6c9',4,11)});
setTimeout(()=>{set.forEach(k=>{g[k>>3][k&7]=-1;removeFilled(k)});render([...set]);scheduleAmbient();after()},320)}
else{combo=0;SND.level(0);after()}}
function after(){if(pcs.every(x=>!x)){deal();tray(true)}
busy=false;if(!pcs.some(p=>p&&can(p)))setTimeout(over,450)}
function over(){SND.over(score>=best&&score>0);
$('#fs').textContent=score;$('#nb').textContent=score>=best&&score>0?'New best score!':'Best: '+best;$('#ov').hidden=false}
function clearMessage(){if(messageTimer!==null){clearTimeout(messageTimer);messageTimer=null}const m=$('#msg');m.classList.remove('go');m.textContent=''}
function say(t){const m=$('#msg');if(!t)return;if(messageTimer!==null){clearTimeout(messageTimer);messageTimer=null}m.innerHTML=t;m.classList.remove('go');void m.offsetWidth;m.classList.add('go');messageTimer=setTimeout(()=>{m.classList.remove('go');messageTimer=null},1100)}
$('#again').addEventListener('click',init);
/* particles */
function spark(x,y,col,n,sp){if(document.hidden||motionQuery.matches)return;for(let i=0;i<n;i++)P.push({x:x+(Math.random()-.5)*14,y:y+(Math.random()-.5)*14,vx:(Math.random()-.5)*sp,vy:(Math.random()-.5)*sp-.5,l:1,dl:.022+Math.random()*.022,r:7+Math.random()*10,c:col,star:1,rot:Math.random()*1.5});startEffects()}
function drawStar(p){p.x+=p.vx;p.y+=p.vy;p.l-=p.dl;const a=Math.sin(Math.max(p.l,0)*Math.PI),r=p.r*a;if(r<.3)return;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot+(1-p.l)*1.6);ctx.globalAlpha=Math.min(1,a*1.5);ctx.shadowColor=p.c;ctx.shadowBlur=14;ctx.fillStyle=p.c;
ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(0,0,r,0);ctx.quadraticCurveTo(0,0,0,r);ctx.quadraticCurveTo(0,0,-r,0);ctx.quadraticCurveTo(0,0,0,-r);ctx.fill();ctx.beginPath();ctx.arc(0,0,r*.18,0,6.3);ctx.fillStyle='#fff';ctx.fill();ctx.restore()}
let P=[],run=false,fxFrame=0;
function startEffects(){if(run||document.hidden||motionQuery.matches||!P.length)return;run=true;fxFrame=requestAnimationFrame(loop)}
function stopEffects(){if(fxFrame)cancelAnimationFrame(fxFrame);fxFrame=0;run=false;P.length=0;ctx.clearRect(0,0,innerWidth,innerHeight)}
function stopAmbient(){if(ambientTimer){clearTimeout(ambientTimer);ambientTimer=0}}
function scheduleAmbient(){if(document.hidden||motionQuery.matches||!filledIndices.length){stopAmbient();return}if(ambientTimer)return;ambientTimer=setTimeout(()=>{ambientTimer=0;if(document.hidden||motionQuery.matches||!filledIndices.length)return;const rc=cells[filledIndices[rnd(filledIndices.length)]].getBoundingClientRect();spark(rc.left+rc.width*(.2+Math.random()*.6),rc.top+rc.height*(.15+Math.random()*.5),'#ffffff',1,.6);scheduleAmbient()},650)}
function visibilityEffects(){if(document.hidden||motionQuery.matches){stopAmbient();stopEffects()}else scheduleAmbient()}
document.addEventListener('visibilitychange',visibilityEffects);
if(motionQuery.addEventListener)motionQuery.addEventListener('change',visibilityEffects);else if(motionQuery.addListener)motionQuery.addListener(visibilityEffects);
function sizeFX(){const r=devicePixelRatio||1;FX.width=innerWidth*r;FX.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0)}
function burst(x,y,col,n){if(document.hidden||motionQuery.matches)return;for(let i=0;i<n;i++){const a=Math.random()*6.28,s=2+Math.random()*5;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,r:3+Math.random()*5,c:col})}startEffects()}
function loop(){fxFrame=0;if(document.hidden||motionQuery.matches){stopEffects();return}ctx.clearRect(0,0,innerWidth,innerHeight);let write=0;for(let read=0;read<P.length;read++){const p=P[read];if(p.l<=0)continue;P[write++]=p;if(p.star){drawStar(p);continue}p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.98;p.l-=.022;ctx.globalAlpha=Math.max(p.l,0);ctx.fillStyle=p.c;
ctx.beginPath();ctx.roundRect?ctx.roundRect(p.x,p.y,p.r*p.l*1.4,p.r*p.l*1.4,2):ctx.rect(p.x,p.y,p.r,p.r);ctx.fill()}P.length=write;
ctx.globalAlpha=1;if(P.length)fxFrame=requestAnimationFrame(loop);else run=false}
addEventListener('resize',()=>{sizeFX();tray(false)});
sizeFX();init();
</script>
